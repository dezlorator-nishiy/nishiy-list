<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нищий Демон Лист</title>
    
    <!-- Мета-теги для красивого отображения ссылки в Telegram/Discord -->
    <meta property="og:title" content="Нищий Демон Лист">
    <meta property="og:description" content="NLL (Nishiy Level List) - главный список нищих уровней и игроков">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #0b0c10;
            --container-color: #1f2833;
            --accent-color: #c5a059;
            --text-color: #ffffff;
            --sub-text: #858585;
            --tab-active: #c5a059;
            --tab-inactive: #45a29e;
            --modal-overlay: rgba(0, 0, 0, 0.85);
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 10px rgba(197, 160, 89, 0.3);
        }

        .subtitle {
            color: var(--sub-text);
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--container-color);
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--sub-text);
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .tab-btn:hover {
            color: var(--text-color);
        }

        .tab-btn.active {
            color: var(--tab-active);
            border-bottom: 3px solid var(--tab-active);
        }

        .content-section {
            display: none;
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.4s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .list-item {
            background-color: var(--container-color);
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-left: 4px solid var(--accent-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .list-item:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .rank {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            margin-right: 20px;
            min-width: 35px;
        }

        .info {
            flex-grow: 1;
        }

        .level-name, .player-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .author {
            font-size: 14px;
            color: var(--sub-text);
        }

        .flag {
            font-size: 20px;
            margin-left: 15px;
        }

        footer {
            margin-top: auto;
            padding-top: 30px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            border-top: 1px solid var(--container-color);
        }

        .creators {
            font-size: 13px;
            color: var(--sub-text);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .tg-button {
            display: inline-block;
            background-color: #2481cc;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(36, 129, 204, 0.3);
            margin-bottom: 15px;
        }

        .tg-button
